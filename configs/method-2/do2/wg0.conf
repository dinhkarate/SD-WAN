# =============================================================================
# do2 (VPS1) - wg0: Nhận traffic từ PC1
# Host: do2 (152.42.238.137)
# Subnet: 10.10.0.0/24 (PC1 <-> VPS1)
# =============================================================================

[Interface]
Address = 10.10.0.1/24
ListenPort = 51820
PrivateKey = <DO2_WG0_PRIVATE_KEY>

# Routing setup: ipset + fwmark + policy routing
PostUp = /etc/sdwan/routing-setup.sh up
PostDown = /etc/sdwan/routing-setup.sh down

[Peer]
# PC1
PublicKey = <PC1_WG0_PUBLIC_KEY>
AllowedIPs = 10.10.0.2/32

[Peer]
# PC0 (vina7)
PublicKey = <VINA7_WG0_PUBLIC_KEY>
AllowedIPs = 10.10.0.3/32
