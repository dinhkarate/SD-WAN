# =============================================================================
# fominet (VPS2/OpenWRT) - wg1: Exit Node cho China IPs
# Host: fominet (192.168.20.1, WAN: 192.168.1.20, DDNS: thatnghiep.ddns.net)
# Subnet: 10.20.0.0/24 (VPS1 <-> VPS2)
# =============================================================================
# NOTE: Đây là file reference. Deploy thực tế dùng UCI (xem setup-uci.sh)

[Interface]
Address = 10.20.0.2/24
ListenPort = 51821
PrivateKey = <FOMINET_WG1_PRIVATE_KEY>

# NAT traffic từ tunnel ra internet
PostUp = sysctl -w net.ipv4.ip_forward=1
PostUp = iptables -t nat -A POSTROUTING -s 10.20.0.0/24 -o eth0 -j MASQUERADE
PostUp = iptables -t nat -A POSTROUTING -s 10.10.0.0/24 -o eth0 -j MASQUERADE
PostUp = iptables -A FORWARD -i wg1 -j ACCEPT
PostUp = iptables -A FORWARD -o wg1 -m state --state RELATED,ESTABLISHED -j ACCEPT

PostDown = iptables -t nat -D POSTROUTING -s 10.20.0.0/24 -o eth0 -j MASQUERADE
PostDown = iptables -t nat -D POSTROUTING -s 10.10.0.0/24 -o eth0 -j MASQUERADE
PostDown = iptables -D FORWARD -i wg1 -j ACCEPT
PostDown = iptables -D FORWARD -o wg1 -m state --state RELATED,ESTABLISHED -j ACCEPT

[Peer]
# do2 (VPS1)
PublicKey = <DO2_WG1_PUBLIC_KEY>
Endpoint = 152.42.238.137:51821
AllowedIPs = 10.20.0.0/24, 10.10.0.0/24
PersistentKeepalive = 25
